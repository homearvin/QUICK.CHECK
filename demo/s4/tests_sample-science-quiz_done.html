<div class="fx-toast" id="fxToast" role="status" aria-live="polite" hidden></div>

<script>
  // One small message at the top. "Saved" goes by itself after 4 seconds; a warning or a
  // problem stays until it is tapped away, so there is time to read it.
  var QC_TOAST_ICONS = { ok: "\u003csvg class=\"ui-i \" aria-hidden=\"true\"\u003e\u003cuse href=\"#ui-check\"/\u003e\u003c/svg\u003e", warn: "\u003csvg class=\"ui-i \" aria-hidden=\"true\"\u003e\u003cuse href=\"#ui-alert\"/\u003e\u003c/svg\u003e", bad: "\u003csvg class=\"ui-i \" aria-hidden=\"true\"\u003e\u003cuse href=\"#ui-alert\"/\u003e\u003c/svg\u003e" };
  var QC_TOAST_DONE_FOR = 4000;
  function qcToast(text, kind) {
    var box = document.getElementById('fxToast');
    var stays = kind === 'warn' || kind === 'bad';
    box.className = 'fx-toast' + (kind === 'warn' ? ' is-warn' : kind === 'bad' ? ' is-bad' : '');
    box.setAttribute('role', stays ? 'alert' : 'status');
    box.innerHTML = QC_TOAST_ICONS[kind || 'ok'] + '<span></span>' +
      (stays ? '<button type="button" class="fx-toast-x" aria-label="Dismiss this message">&times;</button>' : '');
    box.querySelector('span').textContent = text;
    box.hidden = false;
    clearTimeout(qcToast.timer);
    if (stays) box.querySelector('.fx-toast-x').addEventListener('click', function () { box.hidden = true; });
    else qcToast.timer = setTimeout(function () { box.hidden = true; }, QC_TOAST_DONE_FOR);
  }
  function qcCsrf() { return document.querySelector('#fxCsrf input[name=_csrf]').value; }
  
</script>

<script>
  // Changing a name saves it at once; the suggestions after it follow on, so the list reloads.
  (function () {
    var url = "/tests/sample-science-quiz/done/learner";
    document.querySelectorAll('.fx-name select').forEach(function (select) {
      select.addEventListener('change', function () {
        var data = new FormData();
        data.append('paper_id', select.dataset.paper);
        data.append('learner', select.value);
        fetch(url, { method: 'POST', body: data, credentials: 'same-origin', headers: { 'X-CSRF-Token': qcCsrf() } })
          .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
          .then(function (res) { if (res.ok) location.reload(); else qcToast(res.d.error || 'That name could not be saved.', 'bad'); })
          .catch(function () { qcToast('That name could not be saved. Try again.', 'bad'); });
      });
    });
    var form = document.getElementById('saveForm');
    if (form) form.addEventListener('submit', function () {
      var b = document.getElementById('saveReady');
      b.disabled = true;
      b.textContent = 'Saving…';
    });
  })();
</script>
