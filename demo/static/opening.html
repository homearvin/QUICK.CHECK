<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QuickCheck</title>
  <!--
    The first screen of the desktop app. It opens instantly (it is a plain
    file), shows the QuickCheck logo, then the grey template of Home while the
    class records finish loading — and hands over to the real Home the moment it
    is ready. No spinning circle anywhere.
    The template is the new look's (Arvin, 11 Nov 2026): the same style sheets as
    the app, so on a laptop it is the icon sidebar, the centred Home and the status
    bar, and on the phone the top bar, Home and the bottom bar (skeleton.js).
  -->
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="ui.css">
  <link rel="stylesheet" href="iconlook.css">
  <link rel="stylesheet" href="phone.css">
  <link rel="stylesheet" href="desktop.css">
  <style>
    /* The same green as the logo design, so the logo's own background
       disappears into the screen around it. */
    .qc-splash {
      position: fixed; inset: 0; z-index: 100;
      display: grid; place-items: center;
      background: #005a19;
      transition: opacity .5s ease, visibility .5s;
    }
    .qc-splash.gone { opacity: 0; visibility: hidden; }
    .qc-logo {
      display: block; width: min(86vw, 780px); height: auto;
      animation: qc-logo-in .7s cubic-bezier(.2, .8, .2, 1) both;
    }
    @keyframes qc-logo-in {
      from { opacity: 0; transform: translateY(10px) scale(.96); }
      to   { opacity: 1; transform: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .qc-logo { animation: none; }
    }
  </style>
</head>
<body class="qc-new">
  <!-- Behind the logo: Home's shape, drawn by skeleton.js with the real app's parts
       and style sheets, so the shape the teacher sees here is the shape that arrives. -->
  <header class="ui-top il-top" id="skelTop" aria-hidden="true"></header>
  <nav class="qc-pane" id="skelPane" aria-hidden="true"></nav>
  <div class="app" aria-hidden="true">
    <main class="main" id="skelMain"></main>
  </div>
  <footer class="qc-status" aria-hidden="true"><span class="skel skel-line" style="width:220px;height:10px"></span></footer>
  <nav class="tabbar il-tabbar qc-bar" id="skelBar" aria-hidden="true"></nav>

  <div class="qc-splash" id="splash" role="status" aria-label="QuickCheck is opening">
    <img class="qc-logo" src="brand/quickcheck-logo.png" width="1420" height="377"
         decoding="async" fetchpriority="high" alt="QuickCheck — From exam to learning insight">
  </div>

  <script src="alive.js"></script>
  <script src="skeleton.js"></script>
  <script>
    (function () {
      var LOGO_MS = 1100;          // how long the logo stays up
      var TEMPLATE_MIN_MS = 500;   // the template is always seen, never just flashed
      var CHECK_EVERY_MS = 250;
      var GIVE_UP_MS = 20000;      // open the dashboard anyway, even if still loading
      var started = Date.now();

      document.getElementById("skelTop").innerHTML = QCSkeleton.phoneTop();
      document.getElementById("skelPane").innerHTML = QCSkeleton.pane();
      document.getElementById("skelBar").innerHTML = QCSkeleton.phoneBar();
      document.getElementById("skelMain").innerHTML = QCSkeleton.home();

      setTimeout(function () {
        document.getElementById("splash").classList.add("gone");
      }, LOGO_MS);

      function openDashboard() {
        var wait = Math.max(0, LOGO_MS + TEMPLATE_MIN_MS - (Date.now() - started));
        // replace(): the Back button should never return to this opening screen.
        setTimeout(function () { location.replace("/"); }, wait);
      }

      function checkReady() {
        if (Date.now() - started > GIVE_UP_MS) return openDashboard();
        fetch("/ready", { cache: "no-store" })
          .then(function (r) { return r.json(); })
          .then(function (d) { return d.ready ? openDashboard() : setTimeout(checkReady, CHECK_EVERY_MS); })
          .catch(function () { setTimeout(checkReady, CHECK_EVERY_MS); });
      }

      checkReady();
    }());
  </script>
</body>
</html>
