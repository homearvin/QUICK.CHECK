<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QuickCheck</title>
  <!--
    The first screen of the desktop app. It opens instantly (it is a plain
    file), shows the QuickCheck logo, then the grey template of the dashboard
    while the class records finish loading — and hands over to the real
    dashboard the moment it is ready. No spinning circle anywhere.
  -->
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="ui.css">
  <style>
    /* The same green as the logo design, so the logo's own background
       disappears into the screen around it. */
    .qc-splash {
      position: fixed; inset: 0; z-index: 100;
      display: grid; place-items: center;
      background: #005a19;
      transition: opacity .5s ease, visibility .5s;
    }
    .qc-splash.gone { opacity: 0; visibility: hidden; }
    .qc-logo {
      display: block; width: min(86vw, 780px); height: auto;
      animation: qc-logo-in .7s cubic-bezier(.2, .8, .2, 1) both;
    }
    @keyframes qc-logo-in {
      from { opacity: 0; transform: translateY(10px) scale(.96); }
      to   { opacity: 1; transform: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .qc-logo { animation: none; }
    }
  </style>
</head>
<body>
  <!-- Behind the logo: the dashboard's shape, drawn by skeleton.js. The classes
       are the real app's (ui.css), so the shape the teacher sees here is the
       shape that arrives. -->
  <header class="ui-top" aria-hidden="true">
    <span class="skel skel-chip" style="width:34px;height:34px"></span>
    <span class="skel skel-line" style="width:150px;height:14px"></span>
    <span class="ui-spacer"></span>
    <span class="skel skel-pill"></span>
  </header>
  <div class="app" aria-hidden="true">
    <aside class="ui-side" id="skelSidebar"></aside>
    <main class="main" id="skelMain"></main>
  </div>

  <div class="qc-splash" id="splash" role="status" aria-label="QuickCheck is opening">
    <img class="qc-logo" src="brand/quickcheck-logo.png" width="1420" height="377"
         decoding="async" fetchpriority="high" alt="QuickCheck — From exam to learning insight">
  </div>

  <script src="alive.js"></script>
  <script src="skeleton.js"></script>
  <script>
    (function () {
      var LOGO_MS = 1100;          // how long the logo stays up
      var TEMPLATE_MIN_MS = 500;   // the template is always seen, never just flashed
      var CHECK_EVERY_MS = 250;
      var GIVE_UP_MS = 20000;      // open the dashboard anyway, even if still loading
      var started = Date.now();

      document.getElementById("skelSidebar").innerHTML = QCSkeleton.sidebar();
      document.getElementById("skelMain").innerHTML = QCSkeleton.dashboard();

      setTimeout(function () {
        document.getElementById("splash").classList.add("gone");
      }, LOGO_MS);

      function openDashboard() {
        var wait = Math.max(0, LOGO_MS + TEMPLATE_MIN_MS - (Date.now() - started));
        // replace(): the Back button should never return to this opening screen.
        setTimeout(function () { location.replace("/"); }, wait);
      }

      function checkReady() {
        if (Date.now() - started > GIVE_UP_MS) return openDashboard();
        fetch("/ready", { cache: "no-store" })
          .then(function (r) { return r.json(); })
          .then(function (d) { return d.ready ? openDashboard() : setTimeout(checkReady, CHECK_EVERY_MS); })
          .catch(function () { setTimeout(checkReady, CHECK_EVERY_MS); });
      }

      checkReady();
    }());
  </script>
</body>
</html>
