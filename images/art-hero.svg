<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 600" width="680" height="600" role="img"
     aria-label="A phone photographing an answer sheet, with the score and the class result appearing beside it">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfdfd"/><stop offset="1" stop-color="#eef4f5"/>
    </linearGradient>
    <radialGradient id="tint" cx="0.78" cy="0.12" r="0.8">
      <stop offset="0" stop-color="#12a594" stop-opacity=".10"/>
      <stop offset="1" stop-color="#12a594" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12a594" stop-opacity="0"/>
      <stop offset=".55" stop-color="#12a594" stop-opacity=".16"/>
      <stop offset="1" stop-color="#12a594" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbfb"/><stop offset="1" stop-color="#eaf3f2"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#17413d" flood-opacity=".13"/>
    </filter>
    <filter id="card" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#17413d" flood-opacity=".12"/>
    </filter>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#0f4b47" fill-opacity=".07"/>
    </pattern>
  </defs>

  <!-- light backdrop -->
  <rect width="680" height="600" rx="34" fill="url(#bg)"/>
  <rect width="680" height="600" rx="34" fill="url(#tint)"/>
  <rect x="34" y="34" width="612" height="532" rx="24" fill="url(#dots)"/>
  <rect x="0.75" y="0.75" width="678.5" height="598.5" rx="33" fill="none" stroke="#dde8e8" stroke-width="1.5"/>

  <!-- the answer sheet -->
  <g transform="rotate(-6 300 330)" filter="url(#soft)">
    <rect x="126" y="126" width="348" height="410" rx="16" fill="#ffffff" stroke="#e7eeee" stroke-width="1.5"/>
    <rect x="146" y="146" width="24" height="24" rx="4" fill="#0f4b47"/>
    <rect x="430" y="146" width="24" height="24" rx="4" fill="#0f4b47"/>
    <rect x="146" y="492" width="24" height="24" rx="4" fill="#0f4b47"/>
    <rect x="430" y="492" width="24" height="24" rx="4" fill="#0f4b47"/>
    <rect x="186" y="150" width="148" height="8" rx="4" fill="#dbe6e5"/>
    <rect x="186" y="165" width="94" height="6" rx="3" fill="#eaf1f0"/>
    <g>
      <g transform="translate(168 210)">
        <circle cx="0" cy="0" r="8.5" fill="#0f4b47"/><circle cx="34" cy="0" r="8.5" fill="none" stroke="#dbe6e5" stroke-width="2.2"/>
        <circle cx="68" cy="0" r="8.5" fill="none" stroke="#dbe6e5" stroke-width="2.2"/><circle cx="102" cy="0" r="8.5" fill="none" stroke="#dbe6e5" stroke-width="2.2"/>
        <rect x="150" y="-4" width="128" height="7" rx="3.5" fill="#f0f5f4"/>
      </g>
      <g transform="translate(168 258)">
        <circle cx="0" cy="0" r="8.5" fill="none" stroke="#dbe6e5" stroke-width="2.2"/><circle cx="34" cy="0" r="8.5" fill="none" stroke="#dbe6e5" stroke-width="2.2"/>
        <circle cx="68" cy="0" r="8.5" fill="#0f4b47"/><circle cx="102" cy="0" r="8.5" fill="none" stroke="#dbe6e5" stroke-width="2.2"/>
        <rect x="150" y="-4" width="104" height="7" rx="3.5" fill="#f0f5f4"/>
      </g>
      <g transform="translate(168 306)">
        <circle cx="0" cy="0" r="8.5" fill="none" stroke="#dbe6e5" stroke-width="2.2"/><circle cx="34" cy="0" r="8.5" fill="#12a594"/>
        <circle cx="68" cy="0" r="8.5" fill="none" stroke="#dbe6e5" stroke-width="2.2"/><circle cx="102" cy="0" r="8.5" fill="none" stroke="#dbe6e5" stroke-width="2.2"/>
        <rect x="150" y="-4" width="122" height="7" rx="3.5" fill="#f0f5f4"/>
      </g>
      <g transform="translate(168 354)">
        <circle cx="0" cy="0" r="8.5" fill="none" stroke="#dbe6e5" stroke-width="2.2"/><circle cx="34" cy="0" r="8.5" fill="none" stroke="#dbe6e5" stroke-width="2.2"/>
        <circle cx="68" cy="0" r="8.5" fill="none" stroke="#dbe6e5" stroke-width="2.2"/><circle cx="102" cy="0" r="8.5" fill="#0f4b47"/>
        <rect x="150" y="-4" width="90" height="7" rx="3.5" fill="#f0f5f4"/>
      </g>
      <g transform="translate(168 402)">
        <circle cx="0" cy="0" r="8.5" fill="#0f4b47"/><circle cx="34" cy="0" r="8.5" fill="none" stroke="#dbe6e5" stroke-width="2.2"/>
        <circle cx="68" cy="0" r="8.5" fill="none" stroke="#dbe6e5" stroke-width="2.2"/><circle cx="102" cy="0" r="8.5" fill="none" stroke="#dbe6e5" stroke-width="2.2"/>
        <rect x="150" y="-4" width="114" height="7" rx="3.5" fill="#f0f5f4"/>
      </g>
      <g transform="translate(168 450)">
        <circle cx="0" cy="0" r="8.5" fill="none" stroke="#dbe6e5" stroke-width="2.2"/><circle cx="34" cy="0" r="8.5" fill="none" stroke="#dbe6e5" stroke-width="2.2"/>
        <circle cx="68" cy="0" r="8.5" fill="#12a594"/><circle cx="102" cy="0" r="8.5" fill="none" stroke="#dbe6e5" stroke-width="2.2"/>
        <rect x="150" y="-4" width="136" height="7" rx="3.5" fill="#f0f5f4"/>
      </g>
    </g>
    <rect x="126" y="268" width="348" height="112" fill="url(#beam)"/>
    <rect x="126" y="322" width="348" height="2" fill="#12a594" opacity=".75"/>
  </g>

  <!-- the phone: light, like a product shot -->
  <g filter="url(#soft)">
    <rect x="392" y="130" width="214" height="404" rx="34" fill="#ffffff" stroke="#e0eaea" stroke-width="1.5"/>
    <rect x="406" y="144" width="186" height="376" rx="26" fill="url(#screen)"/>
    <rect x="470" y="156" width="58" height="7" rx="3.5" fill="#dfeae9"/>
    <rect x="428" y="186" width="142" height="196" rx="12" fill="#ffffff" stroke="#dbe8e6" stroke-width="1.5"/>
    <path d="M440 202v-10h12M558 202v-10h-12M440 366v10h12M558 366v10h-12" stroke="#12a594" stroke-width="3" fill="none" stroke-linecap="round"/>
    <g>
      <circle cx="456" cy="230" r="5.5" fill="#12a594"/><circle cx="478" cy="230" r="5.5" fill="none" stroke="#dbe6e5" stroke-width="2"/>
      <circle cx="500" cy="230" r="5.5" fill="none" stroke="#dbe6e5" stroke-width="2"/><circle cx="522" cy="230" r="5.5" fill="none" stroke="#dbe6e5" stroke-width="2"/>
      <circle cx="456" cy="262" r="5.5" fill="none" stroke="#dbe6e5" stroke-width="2"/><circle cx="478" cy="262" r="5.5" fill="none" stroke="#dbe6e5" stroke-width="2"/>
      <circle cx="500" cy="262" r="5.5" fill="#12a594"/><circle cx="522" cy="262" r="5.5" fill="none" stroke="#dbe6e5" stroke-width="2"/>
      <circle cx="456" cy="294" r="5.5" fill="none" stroke="#dbe6e5" stroke-width="2"/><circle cx="478" cy="294" r="5.5" fill="#12a594"/>
      <circle cx="500" cy="294" r="5.5" fill="none" stroke="#dbe6e5" stroke-width="2"/><circle cx="522" cy="294" r="5.5" fill="none" stroke="#dbe6e5" stroke-width="2"/>
      <circle cx="456" cy="326" r="5.5" fill="none" stroke="#dbe6e5" stroke-width="2"/><circle cx="478" cy="326" r="5.5" fill="none" stroke="#dbe6e5" stroke-width="2"/>
      <circle cx="500" cy="326" r="5.5" fill="none" stroke="#dbe6e5" stroke-width="2"/><circle cx="522" cy="326" r="5.5" fill="#12a594"/>
    </g>
    <circle cx="499" cy="452" r="30" fill="none" stroke="#cfe3e0" stroke-width="3"/>
    <circle cx="499" cy="452" r="22" fill="#0f4b47"/>
    <rect x="452" y="496" width="94" height="6" rx="3" fill="#e4eeed"/>
  </g>

  <!-- card: this paper is scored -->
  <g filter="url(#card)" transform="translate(48 402)">
    <rect width="252" height="86" rx="18" fill="#ffffff" stroke="#e9f0ef" stroke-width="1.5"/>
    <circle cx="44" cy="43" r="21" fill="#e7f7f2"/>
    <path d="M35 43.5l6.5 6.5L54 37" fill="none" stroke="#0f4b47" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="78" y="38" font-family="Segoe UI,system-ui,sans-serif" font-size="18.5" font-weight="800" fill="#10201f">Scored 44 / 50</text>
    <text x="78" y="61" font-family="Segoe UI,system-ui,sans-serif" font-size="13.5" fill="#6b7d7b">saved to your class record</text>
  </g>

  <!-- card: the class result -->
  <g filter="url(#card)" transform="translate(402 22)">
    <rect width="236" height="104" rx="18" fill="#ffffff" stroke="#e9f0ef" stroke-width="1.5"/>
    <text x="20" y="34" font-family="Segoe UI,system-ui,sans-serif" font-size="12" font-weight="800" fill="#6b7d7b" letter-spacing="1.5">CLASS MPS</text>
    <text x="20" y="72" font-family="Segoe UI,system-ui,sans-serif" font-size="33" font-weight="850" fill="#10201f">78.4</text>
    <g transform="translate(140 30)">
      <rect x="0" y="30" width="13" height="22" rx="3.5" fill="#dcefeb"/>
      <rect x="21" y="18" width="13" height="34" rx="3.5" fill="#a9ddd3"/>
      <rect x="42" y="8" width="13" height="44" rx="3.5" fill="#12a594"/>
      <rect x="63" y="22" width="13" height="30" rx="3.5" fill="#0f4b47"/>
    </g>
    <text x="20" y="92" font-family="Segoe UI,system-ui,sans-serif" font-size="12.5" fill="#6b7d7b">whole class, one save</text>
  </g>
</svg>
